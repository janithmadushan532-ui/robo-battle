name: Extract Robo Battle ZIP

on:
  push:
    branches:
      - main
    paths:
      - "robo battle.zip"
      - ".github/workflows/extract-robo-battle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p robo-battle
          unzip -o "robo battle.zip" -d robo-battle

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add robo-battle
          git commit -m "Extract Robo Battle project" || echo "No changes to commit"
          git push 

